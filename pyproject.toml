[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrcpy-human-automation"
version = "0.1.0"
description = "Human-like automation helpers for scrcpy + adb workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "av>=18.1",
  "numpy>=2.1",
  "opencv-python>=4.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
